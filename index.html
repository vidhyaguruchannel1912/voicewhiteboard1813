<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GARVIT SMARTBOARD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff}
:root{--gold:#d6ad55;--gold2:#fff0a8;--panel:#12161c;--muted:#9da5b2}
#frame{position:fixed;inset:7px;border:12px solid #8b6a2c;border-radius:18px;background:#101419;box-shadow:0 0 0 2px #f4dc83,0 0 0 6px #3b2b10,0 10px 40px #000;overflow:hidden}
#frame:before{content:"";position:absolute;inset:0;border:2px solid rgba(255,239,160,.8);pointer-events:none;z-index:20;border-radius:6px}
#top{height:54px;background:linear-gradient(#171c23,#0d1116);display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #4d3b18;position:relative;z-index:10}
#topActions{display:flex;align-items:center;gap:7px;margin-left:10px}.topbtn{height:40px;min-width:40px;padding:0 11px;border-radius:12px;background:#111820;border:1px solid #303b46;color:#e9edf2;font-weight:800;letter-spacing:1px}.topbtn:hover{border-color:#d6ad55}.micdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#77879a;margin-right:7px}.topbtn.micOn .micdot{background:#58d68d;box-shadow:0 0 9px #58d68d}.topbtn.micOn{border-color:#4b8b68;color:#baf0ce}
.brand{font-weight:900;letter-spacing:1px;color:#f7df8b;margin-right:auto;font-size:15px}.brand small{display:block;color:#88919d;font-size:9px;letter-spacing:2px;margin-top:2px}
button,.tool{border:1px solid #39414c;background:#1a2028;color:#e9edf2;border-radius:8px;height:36px;padding:0 11px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px #ffffff08}.tool:hover,button:hover{border-color:#a98539}.tool.active{background:#806526;color:#fff4b9;border-color:#e6c86e}.danger:hover{border-color:#d65b5b}.icon{font-size:15px;margin-right:5px}
#main{position:absolute;left:0;right:0;top:54px;bottom:94px;background:#0c1116;display:flex}
#side{display:none}.sidebtn{width:48px;height:43px;padding:2px;font-size:9px}.sidebtn b{display:block;font-size:16px;margin-bottom:1px}
#workspace{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#boardWrap{position:relative;flex:1;min-height:0;margin:10px;border:1px solid #26303b;border-radius:10px;overflow:hidden;background:#123522;box-shadow:inset 0 0 50px #0007}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#watermark{position:absolute;right:18px;bottom:14px;font-size:13px;letter-spacing:1.5px;color:#fff;opacity:.2;pointer-events:none;font-weight:800}
#bottomTools{position:absolute;left:50%;transform:translateX(-50%);bottom:38px;height:68px;width:max-content;max-width:calc(100% - 340px);display:flex;align-items:center;gap:5px;padding:7px 8px;background:linear-gradient(#181e25,#0e1318);border:1px solid #34404d;border-radius:16px;box-shadow:0 5px 24px #000b;z-index:11;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
#bottomTools .tool{height:54px;min-width:58px;border-radius:13px;border-color:transparent;background:transparent;padding:4px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;letter-spacing:.7px}.tool .icon{font-size:14px;margin:0;line-height:1}.tool.active{background:#3f83f7;color:#fff;border-color:#4d91ff;box-shadow:0 0 18px #0005}
#pageControls{position:absolute;left:calc(50% + 355px);transform:translateX(0);bottom:38px;height:68px;min-width:178px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(#181e25,#0e1318);border:1px solid #34404d;border-radius:16px;box-shadow:0 5px 24px #000b;z-index:11;color:#fff}
#pageControls button{height:52px;width:38px;padding:0;background:transparent;border-color:transparent;font-size:25px;color:#e9edf2;border-radius:11px}#pageControls button:hover{background:#202833;border-color:#3b4652}#dockPage{font-size:10px;letter-spacing:1.4px;font-weight:800;min-width:42px;text-align:center;color:#dbe1e8}
#bottomTools .tool{flex:0 0 auto;height:40px}
.topInfo{font-size:10px;letter-spacing:2px;color:#8e97a3;margin-left:auto}
#status{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:10px;padding:0 12px;color:#9ca5b0;font-size:12px;background:#11161c;border-top:1px solid #29313a}.dot{width:8px;height:8px;border-radius:50%;background:#58d68d;box-shadow:0 0 9px #58d68d}
#pagesPanel{position:absolute;right:12px;top:12px;width:245px;bottom:72px;background:#12171d;border:1px solid #4b5662;border-radius:12px;z-index:15;padding:10px;box-shadow:0 15px 45px #0009;display:none}.pagesHead{display:flex;align-items:center;margin-bottom:8px}.pagesHead strong{margin-right:auto}.close{width:30px;height:30px;padding:0}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;height:calc(100% - 42px)}.thumb{height:95px;background:#123522;border:1px solid #48515b;border-radius:7px;position:relative;overflow:hidden;cursor:pointer}.thumb.active{border:2px solid #e5c762}.thumb canvas{width:100%;height:100%}.thumb span{position:absolute;left:5px;bottom:4px;font-size:10px;background:#0008;padding:2px 5px;border-radius:5px}
.pop{position:absolute;z-index:30;background:#151a20;border:1px solid #59626d;border-radius:10px;padding:9px;box-shadow:0 12px 35px #000b;display:none}.pop.open{display:block}.swatches{display:flex;gap:7px}.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff5;cursor:pointer}.minirow{display:flex;gap:6px;margin-top:8px}.minirow button{height:30px;padding:0 8px;font-size:11px}
#insertPop{left:50%;transform:translateX(-50%);bottom:76px;top:auto;width:175px}.insertBtn{width:100%;margin:3px 0;text-align:left}.shapeGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.shapeGrid button{height:31px;padding:0;font-size:11px}
#boardPop{left:50%;transform:translateX(-50%);bottom:76px;top:auto}.gridline{background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:28px 28px}
#preview{position:absolute;inset:0;background:#10151a;z-index:12;display:none;align-items:center;justify-content:center}.previewCard{width:92%;height:90%;border:10px solid #8b6a2c;border-radius:12px;box-shadow:0 0 0 2px #f4dc83;background:#123522;overflow:hidden}.previewCard canvas{width:100%;height:100%}
#selectionBox{position:absolute;border:2px dashed #f6df79;box-shadow:0 0 12px #000;pointer-events:none;display:none;z-index:9}.handle{position:absolute;width:12px;height:12px;background:#fff3a4;border:2px solid #49370e;border-radius:50%;pointer-events:auto}.h1{left:-7px;top:-7px}.h2{right:-7px;top:-7px}.h3{left:-7px;bottom:-7px}.h4{right:-7px;bottom:-7px}
#toast{position:absolute;left:50%;bottom:50px;transform:translateX(-50%);background:#111923ee;border:1px solid #d2ae57;color:#fff0b1;padding:8px 13px;border-radius:9px;font-size:12px;z-index:40;opacity:0;transition:.18s;pointer-events:none}.show{opacity:1!important}
@media(max-width:900px){#top .tool span{display:none}.tool{padding:0 8px}.brand{font-size:12px}.sidebtn{width:45px}.sidebtn b{font-size:14px}}
</style></head>
<body>
<div id="frame">
<header id="top">
<div class="brand">GARVIT SMARTBOARD<small>CLASSROOM EDITION</small></div>
<div class="topInfo">SMART CLASSROOM • READY</div>
<div id="topActions"><button class="topbtn" id="micBtn"><span class="micdot"></span><span id="micLabel">MIC OFF</span></button><button class="topbtn" id="handBtn" title="Touch / Hand mode">✋</button><button class="topbtn" id="fullBtn" title="Fullscreen">⛶</button></div>
</header>
<div id="main">
<aside id="side" aria-hidden="true"></aside>
<section id="workspace">
<div id="boardWrap"><canvas id="board"></canvas><div id="selectionBox"><i class="handle h1"></i><i class="handle h2"></i><i class="handle h3"></i><i class="handle h4"></i></div><div id="watermark">DESIGN AND DEVELOPED BY GARVIT</div>
<div id="insertPop" class="pop"><div style="font-size:11px;color:#aeb7c2;margin:2px 4px 6px">INSERT</div><button class="insertBtn" id="stickyBtn">📝 Sticky Note</button><button class="insertBtn" id="tableBtn">▦ Table</button><div style="font-size:11px;color:#aeb7c2;margin:8px 4px 5px">SHAPES</div><div class="shapeGrid"><button data-shape="rect">Rectangle</button><button data-shape="circle">Circle</button><button data-shape="tri">Triangle</button><button data-shape="line">Line</button><button data-shape="arrow">Arrow</button></div></div>
<div id="boardPop" class="pop"><div style="font-size:11px;color:#aeb7c2;margin-bottom:7px">BOARD COLOUR</div><div class="swatches"><i class="sw" data-board="#123522" style="background:#123522"></i><i class="sw" data-board="#090909" style="background:#090909"></i><i class="sw" data-board="#f5f5f0" style="background:#f5f5f0"></i><i class="sw" data-board="#18222b" style="background:#18222b"></i></div><div class="minirow"><button id="gridToggle">GRID</button></div></div>
<div id="colorPop" class="pop" style="left:50%;transform:translateX(-50%);bottom:76px;top:auto"><div style="font-size:11px;color:#aeb7c2;margin-bottom:7px">PEN COLOUR</div><div class="swatches"><i class="sw" data-color="#ffffff" style="background:#fff"></i><i class="sw" data-color="#e53935" style="background:#e53935"></i><i class="sw" data-color="#42a5f5" style="background:#42a5f5"></i><i class="sw" data-color="#fdd835" style="background:#fdd835"></i><i class="sw" data-color="#66bb6a" style="background:#66bb6a"></i><i class="sw" data-color="#ab47bc" style="background:#ab47bc"></i><i class="sw" data-color="#ff8f00" style="background:#ff8f00"></i></div></div>
</div>
<div id="bottomTools">
<button class="tool active" id="penBtn"><span class="icon">✎</span><span>PEN</span></button>
<button class="tool" id="eraserBtn"><span class="icon">⌫</span><span>ERASER</span></button>
<button class="tool" id="selectBtn"><span class="icon">↖</span><span>MOVE / SELECT</span></button>
<button class="tool" id="insertBtn"><span class="icon">＋</span><span>INSERT</span></button>
<button class="tool" id="boardBtn"><span class="icon">▣</span><span>BOARD</span></button>
<button class="tool" id="colorBtn"><span class="icon">●</span><span>COLOUR</span></button>
<button class="tool" id="undo"><span class="icon">↶</span><span>UNDO</span></button>
<button class="tool" id="redo"><span class="icon">↷</span><span>REDO</span></button>
<button class="tool" id="clear"><span class="icon">⌫</span><span>CLEAR</span></button>
<button class="tool" id="previewBtn"><span class="icon">◉</span><span>PREVIEW</span></button>
<button class="tool" id="pngBtn"><span class="icon">⇩</span><span>PNG</span></button>
<button class="tool" id="pagesBtn"><span class="icon">▦</span><span>PAGES</span></button>
</div>
<div id="pageControls" aria-label="Page controls">
<button id="dockPrev" title="Previous page">‹</button>
<span id="dockPage">1 / 1</span>
<button id="dockNext" title="Next page">›</button>
<button id="dockAdd" title="Add page">＋</button>
</div>
<div id="status"><span class="dot"></span><span id="statusText">Pen • White • Page 1</span><span style="margin-left:auto">Voice: Chrome / Edge</span></div>
</section></div>
<div id="pagesPanel"><div class="pagesHead"><strong>Pages</strong><button class="close" id="closePages">×</button></div><div class="minirow" style="margin:0 0 8px"><button id="prevPage">← PREV</button><button id="nextPage">NEXT →</button><button id="addPageTop">＋ ADD</button></div><div class="thumbs" id="thumbs"></div></div>
<div id="preview"><div class="previewCard"><canvas id="previewCanvas"></canvas></div></div><div id="toast"></div>
</div>
<script>
const board=document.getElementById('board'),ctx=board.getContext('2d'),wrap=document.getElementById('boardWrap');
const S={tool:'pen',color:'#fff',size:4,board:'#123522',grid:false,pages:[newPage()],page:0,history:[],future:[],drawing:false,points:[],selected:null,drag:null,touches:new Map(),gesture:null};
function newPage(){return {strokes:[],shapes:[],objects:[]}}
function clone(x){return JSON.parse(JSON.stringify(x))}
function snapshot(){return clone(S.pages[S.page])}
function commit(){S.history.push(snapshot());if(S.history.length>80)S.history.shift();S.future=[];updateUI()}
function restore(p){S.pages[S.page]=clone(p);S.selected=null;hideSelection();render();updateUI()}
function undo(){if(!S.history.length){toast('Nothing to undo');return}S.future.push(snapshot());restore(S.history.pop());toast('Undo: previous step removed')}
function redo(){if(!S.future.length){toast('Nothing to redo');return}S.history.push(snapshot());restore(S.future.pop());toast('Redo: step restored')}
function newAction(){commit()}
function resize(){const r=wrap.getBoundingClientRect(),d=devicePixelRatio||1;board.width=r.width*d;board.height=r.height*d;board.style.width=r.width+'px';board.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);render()}
addEventListener('resize',resize);resize();
function pos(e){const r=board.getBoundingClientRect();return{x:(e.clientX-r.left),y:(e.clientY-r.top)}}
function drawStroke(c,p){if(p.length<2)return;c.save();c.strokeStyle=c.color;c.lineWidth=c.w;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)c.lineTo(p[i].x,p[i].y);c.stroke();c.restore()}
function drawShape(c,s){c.save();c.strokeStyle=s.color;c.lineWidth=s.w;c.lineCap='round';c.lineJoin='round';const x=s.x,y=s.y,w=s.wd,h=s.ht;c.beginPath();if(s.type==='rect')c.rect(x,y,w,h);else if(s.type==='circle'){c.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2)}else if(s.type==='tri'){c.moveTo(x+w/2,y);c.lineTo(x+w,y+h);c.lineTo(x,y+h);c.closePath()}else{c.moveTo(x,y);c.lineTo(x+w,y+h);if(s.type==='arrow'){const a=Math.atan2(h,w),L=13;c.moveTo(x+w,y+h);c.lineTo(x+w-L*Math.cos(a-.5),y+h-L*Math.sin(a-.5));c.moveTo(x+w,y+h);c.lineTo(x+w-L*Math.cos(a+.5),y+h-L*Math.sin(a+.5))}}c.stroke();c.restore()}
function drawObject(c,o){c.save();c.translate(o.x,o.y);if(o.type==='sticky'){c.fillStyle=o.color;c.fillRect(0,0,o.w,o.h);c.fillStyle='#1c1c1c';c.font='bold 16px Segoe UI';const words=(o.text||'Sticky Note').split(' ');let line='',yy=25;for(const wd of words){const test=line?line+' '+wd:wd;if(c.measureText(test).width>o.w-20){c.fillText(line,10,yy);yy+=21;line=wd}else line=test}if(line)c.fillText(line,10,yy)}else if(o.type==='table'){c.fillStyle='#ffffff';c.fillRect(0,0,o.w,o.h);c.strokeStyle='#222';c.lineWidth=1;c.strokeRect(0,0,o.w,o.h);for(let i=1;i<o.cols;i++){c.beginPath();c.moveTo(o.w*i/o.cols,0);c.lineTo(o.w*i/o.cols,o.h);c.stroke()}for(let i=1;i<o.rows;i++){c.beginPath();c.moveTo(0,o.h*i/o.rows);c.lineTo(o.w,o.h*i/o.rows);c.stroke()}}c.restore()}
function render(target=ctx){const c=target,W=target.canvas.width/(target===ctx?(devicePixelRatio||1):1),H=target.canvas.height/(target===ctx?(devicePixelRatio||1):1);c.save();c.setTransform(target===ctx?(devicePixelRatio||1):1,0,0,target===ctx?(devicePixelRatio||1):1,0,0);c.fillStyle=S.board;c.fillRect(0,0,W,H);if(S.grid){c.strokeStyle='#ffffff12';c.lineWidth=1;for(let x=0;x<W;x+=28){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<H;y+=28){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}}const p=S.pages[S.page];p.strokes.forEach(st=>drawStroke(c,{color:st.color,w:st.w},st.points));p.shapes.forEach(s=>drawShape(c,s));p.objects.forEach(o=>drawObject(c,o));c.restore();if(target===ctx)updateSelectionBox()}
function setTool(t){S.tool=t;document.querySelectorAll('.sidebtn').forEach(b=>b.classList.remove('active'));const el={pen:'penBtn',eraser:'eraserBtn',select:'selectBtn'}[t];if(el)document.getElementById(el).classList.add('active');status();}
function status(){document.getElementById('statusText').textContent=(S.tool==='select'?'Move / Select':S.tool[0].toUpperCase()+S.tool.slice(1))+' • '+S.color+' • Page '+(S.page+1)}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('show'),1300)}
function hidePop(){document.querySelectorAll('.pop').forEach(x=>x.classList.remove('open'))}
function addObject(o){newAction();S.pages[S.page].objects.push(o);render();}
function openInsert(){hidePop();document.getElementById('insertPop').classList.toggle('open')}
document.getElementById('penBtn').onclick=()=>{hidePop();setTool('pen')};document.getElementById('eraserBtn').onclick=()=>{hidePop();setTool('eraser')};document.getElementById('selectBtn').onclick=()=>{hidePop();setTool('select')};document.getElementById('insertBtn').onclick=openInsert;document.getElementById('boardBtn').onclick=()=>{hidePop();document.getElementById('boardPop').classList.toggle('open')};document.getElementById('colorBtn').onclick=()=>{hidePop();document.getElementById('colorPop').classList.toggle('open')};
document.getElementById('undo').onclick=undo;document.getElementById('redo').onclick=redo;
document.getElementById('clear').onclick=()=>{if(!S.pages[S.page].strokes.length&&!S.pages[S.page].shapes.length&&!S.pages[S.page].objects.length)return;newAction();S.pages[S.page]=newPage();render();toast('Board cleared')};
document.getElementById('stickyBtn').onclick=()=>{hidePop();const text=prompt('Sticky note text:','Important point');if(text!==null)addObject({type:'sticky',x:120,y:90,w:190,h:130,text,color:'#ffe56d'})};
document.getElementById('tableBtn').onclick=()=>{hidePop();addObject({type:'table',x:180,y:120,w:360,h:200,rows:4,cols:4})};
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>{hidePop();const type=b.dataset.shape;newAction();S.pages[S.page].shapes.push({type,x:170,y:120,wd:240,ht:150,color:S.color,w:S.size});render();toast(type+' added — drag in Select mode')});
document.querySelectorAll('[data-color]').forEach(x=>x.onclick=()=>{S.color=x.dataset.color;hidePop();status();toast('Pen colour changed')});document.querySelectorAll('[data-board]').forEach(x=>x.onclick=()=>{S.board=x.dataset.board;hidePop();render();status()});document.getElementById('gridToggle').onclick=()=>{S.grid=!S.grid;render()};
function objectAt(x,y){const p=S.pages[S.page];for(let i=p.objects.length-1;i>=0;i--){const o=p.objects[i];if(x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h)return{kind:'object',i}}for(let i=p.shapes.length-1;i>=0;i--){const s=p.shapes[i],minx=Math.min(s.x,s.x+s.wd),maxx=Math.max(s.x,s.x+s.wd),miny=Math.min(s.y,s.y+s.ht),maxy=Math.max(s.y,s.y+s.ht);if(x>=minx-10&&x<=maxx+10&&y>=miny-10&&y<=maxy+10)return{kind:'shape',i}}for(let i=p.strokes.length-1;i>=0;i--){const st=p.strokes[i];for(const q of st.points)if(Math.hypot(x-q.x,y-q.y)<14)return{kind:'stroke',i}}return null}
function allBounds(){const p=S.pages[S.page],pts=[];p.strokes.forEach(s=>s.points.forEach(q=>pts.push(q)));p.shapes.forEach(s=>pts.push({x:s.x,y:s.y},{x:s.x+s.wd,y:s.y+s.ht}));p.objects.forEach(o=>pts.push({x:o.x,y:o.y},{x:o.x+o.w,y:o.y+o.h}));if(!pts.length)return null;let minx=Math.min(...pts.map(q=>q.x)),maxx=Math.max(...pts.map(q=>q.x)),miny=Math.min(...pts.map(q=>q.y)),maxy=Math.max(...pts.map(q=>q.y));return{x:minx-12,y:miny-12,w:maxx-minx+24,h:maxy-miny+24}}
function hideSelection(){S.selected=null;document.getElementById('selectionBox').style.display='none'}
function updateSelectionBox(){const box=document.getElementById('selectionBox');if(S.tool!=='select'){box.style.display='none';return}const b=S.selected?.bounds||allBounds();if(!b){box.style.display='none';return}box.style.display='block';box.style.left=b.x+'px';box.style.top=b.y+'px';box.style.width=b.w+'px';box.style.height=b.h+'px'}
function selectItem(hit){if(hit){S.selected={hit,bounds:hit.kind==='object'?(()=>{const o=S.pages[S.page].objects[hit.i];return{x:o.x,y:o.y,w:o.w,h:o.h}})():allBounds()};}else S.selected={hit:null,bounds:allBounds()};updateSelectionBox()}
board.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){S.touches.set(e.pointerId,pos(e));if(S.touches.size===2){S.drawing=false;const a=[...S.touches.values()];commit();S.gesture={startMid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},lastMid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},startDist:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale:1};}return}startPointer(e)});
function startPointer(e){const q=pos(e);S.start=q;if(S.tool==='select'){const hit=objectAt(q.x,q.y);if(hit){commit();selectItem(hit);S.drag={x:q.x,y:q.y,kind:'single',hit};}else{commit();selectItem(null);S.drag={x:q.x,y:q.y,kind:'group'};}return}if(S.tool==='eraser'){const hit=objectAt(q.x,q.y);if(hit){newAction();removeHit(hit);render()}return}if(S.tool==='pen'){commit();S.drawing=true;S.points=[q];}}
function removeHit(hit){const p=S.pages[S.page];p[hit.kind+'s'].splice(hit.i,1)}
board.addEventListener('pointermove',e=>{if(e.pointerType==='touch'){S.touches.set(e.pointerId,pos(e));if(S.gesture&&S.touches.size>=2){gestureMove();return}return}movePointer(e)});
function movePointer(e){const q=pos(e);if(S.tool==='select'&&S.drag){const dx=q.x-S.drag.x,dy=q.y-S.drag.y;S.drag.x=q.x;S.drag.y=q.y;const p=S.pages[S.page];if(S.drag.kind==='single'){const h=S.drag.hit,arr=p[h.kind+'s'];const o=arr[h.i];if(h.kind==='object'||h.kind==='shape'){o.x+=dx;o.y+=dy}else if(h.kind==='stroke'){o.points.forEach(a=>{a.x+=dx;a.y+=dy})}}else{p.strokes.forEach(s=>s.points.forEach(a=>{a.x+=dx;a.y+=dy}));p.shapes.forEach(o=>{o.x+=dx;o.y+=dy});p.objects.forEach(o=>{o.x+=dx;o.y+=dy})}render();return}if(S.drawing&&S.tool==='pen'){S.points.push(q);render();ctx.save();drawStroke(ctx,{color:S.color,w:S.size},S.points);ctx.restore()}}
board.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){S.touches.delete(e.pointerId);if(S.touches.size<2)S.gesture=null;return}endPointer(e)});board.addEventListener('pointercancel',e=>{if(e.pointerType==='touch')S.touches.delete(e.pointerId);else endPointer(e)});
function endPointer(e){if(S.tool==='select'&&S.drag){S.drag=null;render();return}if(S.drawing&&S.tool==='pen'){S.drawing=false;if(S.points.length>1){S.pages[S.page].strokes.push({points:clone(S.points),color:S.color,w:S.size});}S.points=[];render()}}
function gestureMove(){const a=[...S.touches.values()];if(a.length<2||!S.gesture)return;const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2},dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);const dx=mid.x-S.gesture.lastMid.x,dy=mid.y-S.gesture.lastMid.y,scale=dist/S.gesture.startDist;const factor=scale/S.gesture.scale;transformAll(dx,dy,factor,mid);S.gesture.lastMid=mid;S.gesture.scale=scale;render()}
function transformAll(dx,dy,factor,c){const p=S.pages[S.page];const f=(q)=>{q.x=c.x+(q.x-c.x)*factor+dx;q.y=c.y+(q.y-c.y)*factor+dy};p.strokes.forEach(s=>{s.points.forEach(f);s.w*=factor});p.shapes.forEach(s=>{const q={x:s.x,y:s.y};f(q);s.x=q.x;s.y=q.y;s.wd*=factor;s.ht*=factor;s.w*=factor});p.objects.forEach(o=>{const q={x:o.x,y:o.y};f(q);o.x=q.x;o.y=q.y;o.w*=factor;o.h*=factor})}
// Pages
function renderThumbs(){const el=document.getElementById('thumbs');el.innerHTML='';S.pages.forEach((p,i)=>{const d=document.createElement('div');d.className='thumb'+(i===S.page?' active':'');const c=document.createElement('canvas');c.width=240;c.height=150;const cc=c.getContext('2d');const old=S.pages[S.page],oldPage=S.page;S.pages[S.page]=p;S.page=i;render(cc);S.page=oldPage;S.pages[oldPage]=old;d.appendChild(c);const sp=document.createElement('span');sp.textContent='Page '+(i+1);d.appendChild(sp);d.onclick=()=>{S.page=i;S.history=[];S.future=[];hideSelection();render();renderThumbs();document.getElementById('pagesPanel').style.display='none';status()};el.appendChild(d)})}
function addPage(){S.pages.push(newPage());S.page=S.pages.length-1;S.history=[];S.future=[];render();renderThumbs();status();toast('New page added')}
// Add page button inside pages panel
document.getElementById('addPageTop').onclick=addPage;document.getElementById('prevPage').onclick=()=>{if(S.page>0){S.page--;S.history=[];S.future=[];hideSelection();render();renderThumbs();status()}};document.getElementById('nextPage').onclick=()=>{if(S.page<S.pages.length-1){S.page++;S.history=[];S.future=[];hideSelection();render();renderThumbs();status()}};
document.getElementById('pagesBtn').onclick=()=>{const p=document.getElementById('pagesPanel');p.style.display=p.style.display==='block'?'none':'block';if(p.style.display==='block')renderThumbs()};document.getElementById('closePages').onclick=()=>document.getElementById('pagesPanel').style.display='none';
// Preview + PNG
function fitExportCanvas(c){const W=1600,H=900;c.width=W;c.height=H;const sc=Math.min(W/board.clientWidth,H/board.clientHeight);const off=c.getContext('2d');off.scale(sc,sc);return off}
function exportStamp(cc,sc,W,H){
  const d=new Date();
  const date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const label='DESIGNED & DEVELOPED BY GARVIT';
  cc.save();
  cc.font='800 18px Segoe UI, Arial, sans-serif';
  cc.textAlign='right';
  cc.textBaseline='bottom';
  cc.fillStyle='rgba(255,255,255,.72)';
  cc.shadowColor='rgba(0,0,0,.45)'; cc.shadowBlur=5;
  cc.fillText(label,W/sc-28,H/sc-28);
  cc.font='700 11px Segoe UI, Arial, sans-serif';
  cc.fillStyle='rgba(255,240,168,.75)';
  cc.fillText(date,W/sc-28,H/sc-10);
  cc.restore();
  return date;
}
document.getElementById('pngBtn').onclick=()=>{
  const c=document.createElement('canvas');c.width=1600;c.height=900;
  const cc=c.getContext('2d');
  const sc=Math.min(c.width/board.clientWidth,c.height/board.clientHeight);
  cc.scale(sc,sc);render(cc);
  const date=exportStamp(cc,sc,c.width,c.height);
  const a=document.createElement('a');
  a.download='GARVIT-SMARTBOARD-Page-'+(S.page+1)+'-'+date+'.png';
  a.href=c.toDataURL('image/png');a.click();toast('PNG saved with date + watermark');
};
document.getElementById('previewBtn').onclick=()=>{const p=document.getElementById('preview');p.style.display='flex';const c=document.getElementById('previewCanvas');c.width=1200;c.height=700;const cc=c.getContext('2d');const sc=Math.min(c.width/board.clientWidth,c.height/board.clientHeight);cc.scale(sc,sc);render(cc)};document.getElementById('preview').onclick=e=>{if(e.target.id==='preview')e.currentTarget.style.display='none'};
// Voice: only requested controls. Colour words checked first so "red" never becomes redo.
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(Speech){const rec=new Speech();rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=5;rec.lang='en-IN';let last='',at=0;const colors={blue:'#42a5f5',blu:'#42a5f5',blew:'#42a5f5',red:'#e53935',read:'#e53935',rid:'#e53935',green:'#66bb6a',gren:'#66bb6a',grin:'#66bb6a',white:'#ffffff',wite:'#ffffff',wit:'#ffffff',yellow:'#fdd835',yelo:'#fdd835',yelow:'#fdd835',purple:'#ab47bc',purpl:'#ab47bc',perple:'#ab47bc',black:'#000000',blak:'#000000',orange:'#ff8f00',oranj:'#ff8f00'};function heard(t){t=t.toLowerCase().replace(/[^a-z ]/g,' ');const w=t.split(/\s+/).filter(Boolean);let hit=null;for(const x of w){if(colors[x]){hit={type:'color',v:colors[x]};break}}if(hit){S.color=hit.v;setTool('pen');hidePop();status();toast('Voice: '+hit.v);return}if(/\b(undo|under)\b/.test(t)){if(Date.now()-at<500&&last==='undo')return;last='undo';at=Date.now();undo();return}if(/\b(redo|redue|re do)\b/.test(t)&&!/\b(red|read)\b/.test(t)){if(Date.now()-at<500&&last==='redo')return;last='redo';at=Date.now();redo();return}if(/\b(eraser|erase|erazor|racer)\b/.test(t)){setTool('eraser');return}if(/\b(clear|cleer|clean)\b/.test(t)){document.getElementById('clear').click();return}if(/\b(select|selection|move|mouve)\b/.test(t)){setTool('select');return}if(/\b(pen|pin|penn|write|draw)\b/.test(t)){setTool('pen');return}}rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];heard(r[0].transcript)}};rec.onend=()=>{if(micEnabled){try{rec.start()}catch(e){}}};try{rec.start()}catch(e){}}
function updateDockPage(){const el=document.getElementById('dockPage');if(el)el.textContent=(S.page+1)+' / '+S.pages.length}
const oldStatus=status;
status=function(){oldStatus();updateDockPage()};
document.getElementById('dockPrev').onclick=()=>document.getElementById('prevPage').click();
document.getElementById('dockNext').onclick=()=>document.getElementById('nextPage').click();
document.getElementById('dockAdd').onclick=()=>document.getElementById('addPageTop').click();
document.getElementById('fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
let micEnabled=false;
const micBtn=document.getElementById('micBtn');
function setMicLabel(on){micEnabled=on;micBtn.classList.toggle('micOn',on);document.getElementById('micLabel').textContent=on?'MIC ON':'MIC OFF'}
micBtn.onclick=()=>{if(window._garvitRec){try{if(micEnabled){window._garvitRec.stop();setMicLabel(false)}else{window._garvitRec.start();setMicLabel(true)}}catch(e){}}else{toast('Voice recognition is not supported here')}};
document.getElementById('handBtn').onclick=()=>{setTool('select');toast('Move / Select mode')};
render();status();setMicLabel(false);
</script></body></html>
